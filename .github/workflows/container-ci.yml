name: Container CI

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/container-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/container-ci.yml"

jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PVP Activity API image
        run: docker build -f server/Dockerfile -t pvp-activity:${{ github.sha }} server

      - name: Export image for manual deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save pvp-activity:${{ github.sha }} | gzip > pvp-activity-${{ github.sha }}.tar.gz

      - name: Upload manual deployment artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pvp-activity-${{ github.sha }}
          path: pvp-activity-${{ github.sha }}.tar.gz
          retention-days: 14
          if-no-files-found: error
