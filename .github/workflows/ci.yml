name: CI

on:
  push:
  pull_request:

jobs:
  build-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and test RuneLite plugin
        run: gradle clean test jar
      - name: Upload sideload JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pvp-activity-plugin-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 14
          if-no-files-found: error

  smoke-test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start API
        run: |
          node server/server.js > /tmp/pvp-activity-server.log 2>&1 &
          echo $! > /tmp/pvp-activity-server.pid
      - name: Exercise API
        run: |
          sleep 1
          curl --fail http://127.0.0.1:8080/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/activity)" = "403"
          curl --fail -X POST http://127.0.0.1:8080/v1/heartbeat \
            -H 'Content-Type: application/json' \
            -d '{"sessionId":"11111111-1111-1111-1111-111111111111","world":324,"inWilderness":true,"combatBracket":"71-90","timestamp":0}'
          curl --fail http://127.0.0.1:8080/v1/activity \
            -H 'X-PVP-Session-ID: 11111111-1111-1111-1111-111111111111' | grep '"world":324'
          curl --fail -X DELETE http://127.0.0.1:8080/v1/session/11111111-1111-1111-1111-111111111111
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/pvp-activity-server.log || true
